name: iOS quality

on:
  push:
    branches: ["polish/**"]
    paths:
      - "Calcu Later/**"
      - "Calcu LaterTests/**"
      - "Calcu LaterUITests/**"
      - "Calcu Later.xcodeproj/**"
      - "scripts/ci/**"
      - ".github/workflows/ios-quality.yml"
  workflow_dispatch:

# This workflow can read source and retain test evidence, never deploy or release.
permissions:
  contents: read

concurrency:
  group: ios-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-playtest:
    name: Native ${{ matrix.scenario }}
    # Standard public-repository runner, not a billed larger runner.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      # Keep each scenario's evidence even when another scenario fails.
      fail-fast: false
      matrix:
        include:
          - scenario: standard
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-16
          - scenario: compact
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation
          - scenario: tablet
            device_type: com.apple.CoreSimulator.SimDeviceType.iPad-10th-generation
          - scenario: maximumAccessibilityText
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-16
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-5
      SIM_DEVICE_TYPE: ${{ matrix.device_type }}
      NATIVE_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify environment and create owned simulator
        run: python3 scripts/ci/native_quality.py prepare
      - name: Build app and tests
        run: python3 scripts/ci/native_quality.py build
      - name: Boot and verify simulator readiness
        run: python3 scripts/ci/native_quality.py boot
      - name: Configure and verify layout scenario
        run: python3 scripts/ci/native_quality.py configure
      - name: Run native learning and navigation flows
        run: python3 scripts/ci/native_quality.py test
      - name: Export result evidence
        if: always()
        run: python3 scripts/ci/native_quality.py export
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ matrix.scenario }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Clean up owned simulator
        if: always()
        run: python3 scripts/ci/native_quality.py cleanup
